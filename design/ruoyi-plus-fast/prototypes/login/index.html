<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="color-scheme"
      content="light dark"
    />
    <title>Skyroc 管理系统 - 登录原型</title>
    <style>
      :root {
        color-scheme: light;
        --primary: #5b5ff5;
        --primary-hover: #4c50e8;
        --primary-soft: #eef0ff;
        --page-background: #f4f5f8;
        --panel-background: #ffffff;
        --surface-background: #ffffff;
        --text-heading: #27272a;
        --text-primary: #353535;
        --text-secondary: #656565;
        --text-tertiary: #919191;
        --placeholder: #b0b0b5;
        --border: #cfd0d5;
        --border-soft: #ececf0;
        --control-hover: #a0aeff;
        --shadow: 0 18px 55px rgb(38 42 68 / 12%), 0 2px 8px rgb(38 42 68 / 7%);
        --brand-start: #263eb7;
        --brand-middle: #3d57dd;
        --brand-end: #6474f5;
        --danger: #f43f5e;
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
        --primary: #7477ff;
        --primary-hover: #8588ff;
        --primary-soft: #282a52;
        --page-background: #111317;
        --panel-background: #202327;
        --surface-background: #25282d;
        --text-heading: #f3f4f6;
        --text-primary: #e2e4e9;
        --text-secondary: #aeb2bb;
        --text-tertiary: #81858f;
        --placeholder: #6f747e;
        --border: #4a4e57;
        --border-soft: #353940;
        --control-hover: #7477ff;
        --shadow: 0 20px 60px rgb(0 0 0 / 35%);
        --brand-start: #091b49;
        --brand-middle: #11285f;
        --brand-end: #182f6d;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--page-background);
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 15% 8%, rgb(255 255 255 / 82%), transparent 28%),
          radial-gradient(circle at 86% 82%, rgb(99 102 241 / 7%), transparent 26%), var(--page-background);
        color: var(--text-primary);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        font-size: 14px;
        transition:
          background-color 200ms ease,
          color 200ms ease;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .auth-shell {
        width: min(1280px, calc(100vw - 64px));
        min-height: min(720px, calc(100vh - 64px));
        display: grid;
        grid-template-columns: 46.5% 53.5%;
        overflow: hidden;
        border: 1px solid rgb(21 28 67 / 7%);
        border-radius: 12px;
        background: var(--panel-background);
        box-shadow: var(--shadow);
      }

      .brand-panel {
        position: relative;
        min-height: 718px;
        overflow: hidden;
        padding: 34px 48px;
        color: #ffffff;
        background:
          radial-gradient(circle at 25% 88%, rgb(109 126 255 / 48%), transparent 33%),
          linear-gradient(140deg, var(--brand-start) 0%, var(--brand-middle) 52%, var(--brand-end) 100%);
      }

      .brand-grid {
        position: absolute;
        inset: 0;
        opacity: 0.12;
        background-image:
          linear-gradient(rgb(255 255 255 / 32%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 32%) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(140deg, #000 0%, transparent 63%);
      }

      .orbit {
        position: absolute;
        width: 520px;
        height: 520px;
        left: -82px;
        top: 126px;
        border: 1px solid rgb(255 255 255 / 22%);
        border-radius: 50%;
      }

      .orbit::before,
      .orbit::after {
        content: '';
        position: absolute;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: inherit;
      }

      .orbit::before {
        inset: 56px;
      }

      .orbit::after {
        inset: 118px;
      }

      .orbit-dot {
        position: absolute;
        width: 9px;
        height: 9px;
        border: 1px solid rgb(255 255 255 / 80%);
        border-radius: 50%;
        background: rgb(255 255 255 / 12%);
      }

      .orbit-dot.one {
        left: 129px;
        top: 152px;
      }

      .orbit-dot.two {
        right: 62px;
        top: 215px;
      }

      .orbit-dot.three {
        right: 67px;
        bottom: 106px;
      }

      .glass-ellipse {
        position: absolute;
        left: -25px;
        bottom: 86px;
        width: 82px;
        height: 176px;
        transform: rotate(-24deg);
        border: 1px solid rgb(255 255 255 / 42%);
        border-radius: 50%;
        background: linear-gradient(140deg, rgb(255 255 255 / 28%), rgb(255 255 255 / 3%));
        box-shadow: inset 0 0 26px rgb(255 255 255 / 12%);
      }

      .cube {
        position: absolute;
        left: 102px;
        bottom: 78px;
        width: 52px;
        height: 52px;
        transform: rotate(30deg) skew(-5deg, -5deg);
        border: 1px solid rgb(255 255 255 / 38%);
        background: linear-gradient(145deg, rgb(255 255 255 / 17%), rgb(255 255 255 / 2%));
        box-shadow: 20px 22px 50px rgb(17 31 101 / 28%);
      }

      .cube::before,
      .cube::after {
        content: '';
        position: absolute;
        border: 1px solid rgb(255 255 255 / 23%);
      }

      .cube::before {
        inset: 10px -11px -11px 10px;
      }

      .cube::after {
        inset: 20px -21px -21px 20px;
        opacity: 0.45;
      }

      .brand-header,
      .brand-copy {
        position: relative;
        z-index: 2;
      }

      .brand-header {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-logo {
        width: 46px;
        height: 46px;
        flex: 0 0 auto;
      }

      .brand-name {
        margin: 0;
        font-size: 19px;
        font-weight: 650;
        letter-spacing: 2px;
      }

      .brand-copy {
        width: 420px;
        max-width: 100%;
        margin: 150px auto 0;
      }

      .brand-title {
        margin: 0 0 28px;
        font-size: clamp(28px, 2.35vw, 38px);
        line-height: 1.32;
        font-weight: 650;
        letter-spacing: -0.6px;
      }

      .brand-features {
        display: grid;
        gap: 18px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .brand-feature {
        display: flex;
        align-items: center;
        gap: 12px;
        color: rgb(255 255 255 / 88%);
        font-size: 14px;
      }

      .brand-feature svg {
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
        stroke: currentColor;
      }

      .login-panel {
        position: relative;
        min-width: 0;
        min-height: 718px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 70px 44px 42px;
        background: var(--panel-background);
        transition: background-color 200ms ease;
      }

      .top-actions {
        position: absolute;
        z-index: 4;
        right: 22px;
        top: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-button {
        width: 36px;
        height: 36px;
        display: inline-grid;
        place-items: center;
        padding: 0;
        border: 1px solid var(--border-soft);
        border-radius: 6px;
        background: var(--surface-background);
        cursor: pointer;
        transition:
          border-color 150ms ease,
          background-color 150ms ease,
          transform 150ms ease;
      }

      .icon-button:hover {
        border-color: var(--control-hover);
        background: var(--primary-soft);
      }

      .icon-button:active {
        transform: scale(0.96);
      }

      .icon-button svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
      }

      .language-wrap {
        position: relative;
      }

      .language-menu {
        position: absolute;
        right: 0;
        top: 44px;
        width: 108px;
        display: none;
        padding: 6px;
        border: 1px solid var(--border-soft);
        border-radius: 8px;
        background: var(--surface-background);
        box-shadow: 0 12px 32px rgb(29 35 65 / 16%);
      }

      .language-menu.open {
        display: grid;
        animation: menu-in 150ms ease-out;
      }

      .language-option {
        min-height: 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        text-align: left;
      }

      .language-option:hover {
        background: var(--primary-soft);
      }

      .language-option.active {
        color: var(--primary);
      }

      .language-option.active::after {
        content: '✓';
        font-weight: 700;
      }

      .auth-content {
        width: min(400px, 100%);
      }

      .auth-heading {
        margin-bottom: 28px;
        text-align: center;
      }

      .auth-title {
        margin: 0;
        color: var(--text-heading);
        font-size: 27px;
        line-height: 36px;
        font-weight: 650;
        letter-spacing: -0.4px;
      }

      .auth-subtitle {
        margin: 5px 0 0;
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 20px;
      }

      .auth-form {
        display: grid;
        gap: 15px;
      }

      .form-field {
        min-width: 0;
      }

      .field-label {
        display: block;
        margin-bottom: 6px;
        color: var(--text-primary);
        font-size: 13px;
        line-height: 18px;
        font-weight: 500;
      }

      .field-control {
        position: relative;
      }

      .field-control > svg {
        position: absolute;
        z-index: 1;
        left: 12px;
        top: 50%;
        width: 17px;
        height: 17px;
        transform: translateY(-50%);
        stroke: var(--text-tertiary);
        pointer-events: none;
      }

      .text-input {
        width: 100%;
        height: 40px;
        padding: 0 38px;
        outline: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface-background);
        color: var(--text-primary);
        font-size: 13px;
        transition:
          border-color 150ms ease,
          box-shadow 150ms ease,
          background-color 200ms ease;
      }

      .text-input::placeholder {
        color: var(--placeholder);
      }

      .text-input:hover {
        border-color: var(--control-hover);
      }

      .text-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgb(99 102 241 / 12%);
      }

      .password-toggle {
        position: absolute;
        right: 9px;
        top: 50%;
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        transform: translateY(-50%);
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--text-tertiary);
        cursor: pointer;
      }

      .password-toggle svg {
        width: 17px;
        height: 17px;
        stroke: currentColor;
      }

      .captcha-row,
      .verification-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 96px 64px;
        gap: 10px;
        align-items: center;
      }

      .verification-row {
        grid-template-columns: minmax(0, 1fr) 94px;
      }

      .captcha-box {
        height: 40px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid var(--border-soft);
        border-radius: 5px;
        background:
          radial-gradient(circle at 22% 20%, #d9ece6 0 2px, transparent 3px),
          radial-gradient(circle at 78% 65%, #d5dcef 0 2px, transparent 3px),
          linear-gradient(135deg, #eef4ee, #f4f1e8 48%, #e8edf6);
        color: #20242b;
        cursor: pointer;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 23px;
        letter-spacing: 7px;
        user-select: none;
      }

      .captcha-box::before,
      .captcha-box::after {
        content: '';
        position: absolute;
        width: 110px;
        height: 1px;
        background: #718391;
        opacity: 0.45;
      }

      .captcha-box::before {
        transform: rotate(12deg);
      }

      .captcha-box::after {
        transform: rotate(-9deg);
      }

      .captcha-value {
        position: relative;
        z-index: 1;
      }

      .refresh-button,
      .code-button {
        height: 40px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
      }

      .refresh-button {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        gap: 4px;
        font-size: 12px;
      }

      .refresh-button:hover,
      .text-link:hover {
        color: var(--primary-hover);
      }

      .refresh-button svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
      }

      .code-button {
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--primary);
        font-size: 12px;
      }

      .code-button:hover {
        border-color: var(--primary);
        background: var(--primary-soft);
      }

      .form-options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 20px;
      }

      .checkbox-label {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 12px;
      }

      .checkbox-label input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .checkbox-box {
        width: 14px;
        height: 14px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--surface-background);
      }

      .checkbox-label input:checked + .checkbox-box {
        border-color: var(--primary);
        background: var(--primary);
      }

      .checkbox-label input:checked + .checkbox-box::after {
        content: '';
        width: 7px;
        height: 4px;
        transform: translateY(-1px) rotate(-45deg);
        border-left: 1.5px solid #ffffff;
        border-bottom: 1.5px solid #ffffff;
      }

      .text-link {
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--primary);
        cursor: pointer;
        font-size: 12px;
      }

      .primary-button {
        width: 100%;
        height: 40px;
        border: 0;
        border-radius: 6px;
        background: linear-gradient(90deg, #5261f4 0%, #6264ed 100%);
        box-shadow: 0 6px 16px rgb(82 97 244 / 20%);
        color: #ffffff;
        cursor: pointer;
        font-weight: 600;
        letter-spacing: 3px;
        transition:
          filter 150ms ease,
          transform 150ms ease;
      }

      .primary-button:hover {
        filter: brightness(1.04);
      }

      .primary-button:active {
        transform: translateY(1px);
      }

      .switch-mode {
        margin-top: -2px;
        text-align: center;
      }

      .divider {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 14px;
        color: var(--text-tertiary);
        font-size: 12px;
      }

      .divider::before,
      .divider::after {
        content: '';
        height: 1px;
        background: var(--border-soft);
      }

      .social-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .social-button {
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface-background);
        color: var(--text-primary);
        cursor: pointer;
        font-size: 13px;
        transition:
          border-color 150ms ease,
          background-color 150ms ease;
      }

      .social-button:hover {
        border-color: var(--control-hover);
        background: var(--primary-soft);
      }

      .provider-icon {
        width: 18px;
        height: 18px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }

      .wechat-icon {
        position: relative;
        width: 17px;
        height: 14px;
        border-radius: 50%;
        background: #09bb07;
      }

      .wechat-icon::before {
        content: '';
        position: absolute;
        right: -4px;
        bottom: -2px;
        width: 11px;
        height: 9px;
        border: 1px solid var(--surface-background);
        border-radius: 50%;
        background: #09bb07;
      }

      .wechat-icon::after {
        content: '••';
        position: absolute;
        left: 4px;
        top: -4px;
        color: #ffffff;
        font-size: 9px;
        letter-spacing: 3px;
      }

      .feishu-icon {
        position: relative;
        width: 17px;
        height: 17px;
        transform: rotate(-8deg);
        border-radius: 4px 9px 4px 9px;
        background: linear-gradient(145deg, #24d2e6 0 42%, #3468ff 43% 72%, #6a4cff 73%);
      }

      .feishu-icon::after {
        content: '';
        position: absolute;
        right: -2px;
        top: -2px;
        width: 8px;
        height: 5px;
        transform: rotate(24deg);
        border-radius: 4px 5px 1px;
        background: #ffca28;
      }

      .admin-hint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin: 0;
        color: var(--text-tertiary);
        font-size: 11px;
        line-height: 18px;
        text-align: center;
      }

      .admin-hint svg {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
        stroke: currentColor;
      }

      .auth-footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-top: 16px;
        color: var(--text-tertiary);
        font-size: 11px;
      }

      .auth-footer a {
        color: inherit;
        text-decoration: none;
      }

      .auth-footer a:hover {
        color: var(--primary);
      }

      .auth-footer .copyright {
        margin-left: 18px;
      }

      .login-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-bottom: 18px;
      }

      .login-tab {
        height: 38px;
        border: 1px solid var(--border);
        background: var(--surface-background);
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 12px;
      }

      .login-tab:first-child {
        border-radius: 6px 0 0 6px;
      }

      .login-tab:last-child {
        margin-left: -1px;
        border-radius: 0 6px 6px 0;
      }

      .login-tab.active {
        position: relative;
        z-index: 1;
        border-color: var(--primary);
        background: var(--primary-soft);
        color: var(--primary);
      }

      [hidden] {
        display: none !important;
      }

      @keyframes menu-in {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 900px) {
        body {
          display: block;
          padding: 12px;
          background: var(--page-background);
        }

        .auth-shell {
          width: 100%;
          min-height: calc(100vh - 24px);
          display: block;
          overflow: visible;
        }

        .brand-panel {
          display: none;
        }

        .login-panel {
          min-height: calc(100vh - 26px);
          align-items: flex-start;
          padding: 76px 22px 24px;
          border-radius: 12px;
        }

        .top-actions {
          right: 16px;
          top: 14px;
        }

        .auth-heading {
          margin-bottom: 34px;
        }

        .auth-title {
          font-size: 26px;
        }

        .auth-form {
          gap: 18px;
        }

        .social-buttons {
          grid-template-columns: 1fr;
          gap: 12px;
        }

        .admin-hint {
          margin-top: 8px;
        }

        .auth-footer {
          flex-wrap: wrap;
          margin-top: 20px;
        }

        .auth-footer .copyright {
          width: 100%;
          margin-left: 0;
          text-align: center;
        }
      }

      @media (max-width: 420px) {
        .captcha-row {
          grid-template-columns: minmax(0, 1fr) 92px 58px;
          gap: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <aside
        class="brand-panel"
        aria-label="Skyroc 品牌介绍"
      >
        <div
          class="brand-grid"
          aria-hidden="true"
        ></div>
        <div
          class="orbit"
          aria-hidden="true"
        >
          <span class="orbit-dot one"></span>
          <span class="orbit-dot two"></span>
          <span class="orbit-dot three"></span>
        </div>
        <div
          class="glass-ellipse"
          aria-hidden="true"
        ></div>
        <div
          class="cube"
          aria-hidden="true"
        ></div>

        <header class="brand-header">
          <svg
            class="brand-logo"
            aria-hidden="true"
            viewBox="0 0 160 160"
          >
            <use href="#skyroc-logo"></use>
          </svg>
          <p
            class="brand-name"
            data-i18n="brandName"
          >
            Skyroc 管理系统
          </p>
        </header>

        <section class="brand-copy">
          <h1
            class="brand-title"
            data-i18n="brandTitle"
          >
            让企业管理更清晰、更安全
          </h1>
          <ul class="brand-features">
            <li class="brand-feature">
              <svg
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  d="M12 3 20 7v5c0 4.7-3 7.8-8 9-5-1.2-8-4.3-8-9V7l8-4Z"
                  stroke-width="1.5"
                />
                <path
                  d="M9 12.2 11.1 14 15.5 9.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"

      const root = document.documentElement;

      const passwordInput = document.querySelector('#password');
      const codeAccount = document.querySelector('#codeAccount');
      const codeAccountLabel = document.querySelector('#codeAccountLabel');
      const captchaValue = document.querySelector('#captchaValue');
      let currentLanguage = 'zh-CN';
      let codeMode = 'phone';

      function applyLanguage(language) {
        const dictionary = translations[language];
        currentLanguage = language;
        root.lang = language;

        document.querySelectorAll('[data-i18n]').forEach(element => {
          const key = element.dataset.i18n;
          if (dictionary[key]) element.textContent = dictionary[key];
        });

        document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
          const key = element.dataset.i18nPlaceholder;
          if (dictionary[key]) element.placeholder = dictionary[key];
        });

        document.querySelectorAll('.language-option').forEach(option => {
          option.classList.toggle('active', option.dataset.lang === language);
        });

        updateCodeMode(codeMode);
      }

      function updateCodeMode(mode) {
        const dictionary = translations[currentLanguage];
        const isPhone = mode === 'phone';
        codeMode = mode;
        codeAccount.type = isPhone ? 'tel' : 'email';
        codeAccount.autocomplete = isPhone ? 'tel' : 'email';
        codeAccountLabel.textContent = isPhone ? dictionary.phoneLabel : dictionary.emailLabel;
        codeAccount.placeholder = isPhone ? dictionary.phonePlaceholder : dictionary.emailPlaceholder;

        document.querySelectorAll('[data-code-mode]').forEach(tab => {
          tab.classList.toggle('active', tab.dataset.codeMode === mode);
        });
      }

      function refreshCaptcha() {
        const alphabet = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
        captchaValue.textContent = Array.from(
          { length: 4 },
          () => alphabet[Math.floor(Math.random() * alphabet.length)]
        ).join('');
      }

      function showPrototypeMessage() {
        window.alert(translations[currentLanguage].unavailable);
      }

      themeToggle.addEventListener('click', () => {
        const dark = root.dataset.theme !== 'dark';
        root.dataset.theme = dark ? 'dark' : 'light';
        sunIcon.hidden = dark;
        moonIcon.hidden = !dark;
      });

      languageToggle.addEventListener('click', event => {
        event.stopPropagation();
        languageMenu.classList.toggle('open');
      });

      document.addEventListener('click', () => {
        languageMenu.classList.remove('open');
      });

      document.querySelectorAll('.language-option').forEach(option => {
        option.addEventListener('click', () => {
          applyLanguage(option.dataset.lang);
        });
      });

      passwordToggle.addEventListener('click', () => {
        const showPassword = passwordInput.type === 'password';
        passwordInput.type = showPassword ? 'text' : 'password';
        passwordToggle.setAttribute('aria-label', showPassword ? '隐藏密码' : '显示密码');
      });

      document.querySelector('#showCodeLogin').addEventListener('click', () => {
        passwordForm.hidden = true;
        codeForm.hidden = false;
      });

      document.querySelector('#showPasswordLogin').addEventListener('click', () => {
        codeForm.hidden = true;
        passwordForm.hidden = false;
      });

      document.querySelectorAll('[data-code-mode]').forEach(tab => {
        tab.addEventListener('click', () => updateCodeMode(tab.dataset.codeMode));
      });

      document.querySelector('#captchaBox').addEventListener('click', refreshCaptcha);
      document.querySelector('#captchaRefresh').addEventListener('click', refreshCaptcha);
      document.querySelector('#sendCode').addEventListener('click', showPrototypeMessage);
      document.querySelectorAll('[data-action="unavailable"]').forEach(button => {
        button.addEventListener('click', showPrototypeMessage);
      });

      document.querySelectorAll('form').forEach(form => {
        form.addEventListener('submit', event => {
          event.preventDefault();
          showPrototypeMessage();
        });
      });

      document.querySelectorAll('.auth-footer a').forEach(link => {
        link.addEventListener('click', event => {
          event.preventDefault();
          showPrototypeMessage();
        });
      });
    </script>
  </body>
</html>
